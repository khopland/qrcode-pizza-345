name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: dlj2wldq
      PUBLIC_SANITY_DATASET: production
      PUBLIC_SANITY_API_VERSION: 2026-07-18
      SANITY_STUDIO_PROJECT_ID: dlj2wldq
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
